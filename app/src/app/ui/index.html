<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bombardment UI</title>

  <!-- FOUC prevention: apply light theme before CSS loads -->
  <script>
    (function() {
      var t = localStorage.getItem('bombardment-theme');
      if (t === 'light') document.documentElement.classList.add('light');
    })();
  </script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/static/css/app.min.css?v=4">

  <!-- Font preloads -->
  <link rel="preload" as="font" type="font/woff2" href="/static/fonts/ibm-plex-sans-latin-400.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/static/fonts/ibm-plex-sans-latin-500.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/static/fonts/jetbrains-mono-latin-400.woff2" crossorigin>

  <!-- Preact application bundle -->
  <script src="/static/js/app.min.js?v=4" defer></script>
</head>

<body>
  <div id="app"></div>
</body>

</html>
