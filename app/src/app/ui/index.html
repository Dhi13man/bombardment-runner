<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bombardment UI</title>

  <!-- FOUC prevention: apply light theme before CSS loads -->
  <script>
    (function() {
      var t = localStorage.getItem('bombardment-theme');
      if (t !== 'dark') document.documentElement.classList.add('light');
    })();
  </script>


  <!-- Preact application bundle -->
  <script src="/static/js/app.min.js" defer></script>
</head>

<body>
  <div id="app"></div>
</body>

</html>
