<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bombardment UI</title>

  <!-- FOUC prevention: apply theme before CSS loads -->
  <script>
    (function() {
      var t = localStorage.getItem('bombardment-theme');
      var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (t ? t !== 'dark' : !d) document.documentElement.classList.add('light');
    })();
  </script>

  <!-- Self-hosted fonts (preload critical weights) -->
  <link rel="preload" href="/static/fonts/ibm-plex-sans-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/ibm-plex-sans-latin-500.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Build-time CSS (Tailwind + design tokens) -->
  <link rel="stylesheet" href="/static/css/app.min.css">

  <!-- Preact application bundle -->
  <script src="/static/js/app.min.js" defer></script>
</head>

<body>
  <div id="app"></div>
</body>

</html>
