name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ./app
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Download dependencies
        working-directory: ./app
        run: go mod download
      - name: Run tests with race detector
        working-directory: ./app
        run: go test -v -race -coverprofile=coverage.out ./...
      - name: Check coverage
        working-directory: ./app
        run: go tool cover -func=coverage.out

  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: ./app
        run: npm ci
      - name: Run frontend tests
        working-directory: ./app
        run: npm test

  ui-bundle-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: ./app
        run: npm ci
      - name: Build and check bundle sizes
        run: make check-bundle-size

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, ui-test, ui-bundle-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: ./app
        run: npm ci
      - name: Build frontend assets
        run: make ui-build
      - name: Build binary
        working-directory: ./app
        run: CGO_ENABLED=0 go build -o bombardment .

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t bombardment:ci .
